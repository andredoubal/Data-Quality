"Brokers, taxpayers and officers create most of our data through declarations, returns, registrations and invoices. Keying errors, wrong classification, placeholder values, late filing and unclear guidance introduce defects at the point of submission.",causes:["Broker selects a wrong or generic HS code","Customs value typed instead of calculated","Placeholder buyer VAT number (000000000000000)","Returns prepared from the general ledger, not issued invoices","Late filing by new or small taxpayers"],example:{title:"Output VAT does not match e-invoices",story:"In Q2, 1,870 taxpayers declared output VAT in their VAT return that was more than 2% different from the VAT on the e-invoices they issued in the same period. Most prepared the return from their general ledger, missing credit notes and invoices issued late in the month.",impact:"Estimated 96M of output VAT under-declared across the population, pending follow-up."},detect:"Consistency rule between return and e-invoice totals; completeness rule for buyer VAT; accuracy rule for customs value.",prevent:"Pre-filled VAT returns from e-invoice totals, calculated CIF in the declaration form, placeholder blocking at clearance, broker and taxpayer guidance.",fix:"Risk-based follow-up letters and amended returns; correct declarations through post-clearance audit.",dims:["Accuracy","Consistency","Completeness","Timeliness"]},{id:"integration",icon:rh,name:"Source systems & integrations",stage:2,suggested:!0,what:"Data moves between the Customs Clearance System, Tax Administration System, E-Invoicing Platform, treasury, other agencies and taxpayers’ own ERP systems. Interface mappings, missing validations, timeouts and different rounding logic corrupt or drop data in transit.",causes:["Interface rejects records silently on timeout","Taxpayer ERP (EGS) rounds VAT per line instead of per invoice","Courier manifest API does not map importer TIN","Different code lists in two systems","Batch timing: target read before source finished"],example:{title:"Import VAT not posted to the tax ledger",story:"The nightly Customs → Tax interface transfers import VAT collected at the border to the tax ledger. After a network change, calls that took longer than 30 seconds timed out and the records were dropped without an error. 640 declarations with import VAT were never posted, so the taxpayers could not reclaim it as input VAT.",impact:"11.2M of import VAT missing from the ledger; taxpayer refund claims rejected."},detect:"Record-count and amount reconciliation per interface run; accuracy rule: every import VAT has a ledger ID.",prevent:"Data contracts with explicit types and rounding; quarantine instead of silent drops; interface regression tests; conformance testing for taxpayer EGS units.",fix:"Replay the missing records, add reconciliation that blocks the posting run on mismatch.",dims:["Consistency","Completeness","Accuracy"]},{id:"dwh",icon:Nu,name:"Data warehouse & pipelines",stage:3,what:"The warehouse (landing → curated → gold) transforms and combines Customs, Tax and E-Invoicing data. Transformation bugs, incremental load gaps, amendments, replays and schema drift create defects that don’t exist in the source.",causes:["Incremental load misses amended returns","Replay after an outage duplicates records","Join drops or duplicates rows","Schema change in the source not handled","Failed jobs without alerting (stale data)"],example:{title:"Amended VAT returns missed by the incremental load",story:"The VAT return pipeline picked up changes by original submission date. When 2,310 taxpayers amended their Q1 returns in May, the amendments kept the original submission date and were never loaded. The gold layer still showed the original net VAT payable.",impact:"Net VAT payable for Q1 understated by 38M in the compliance and revenue forecasts."},detect:"Consistency rule between source and gold for latest amendment; row-count reconciliation per layer; freshness rule on load timestamp.",prevent:"Load on am
